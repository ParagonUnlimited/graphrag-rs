# ============================================================================
# Combined Coolify deployment compose: graphrag-server + its Qdrant dependency
# ============================================================================
# The upstream graphrag-server/docker-compose.yml only defines Qdrant (the
# server itself is meant to be run separately, per graphrag-server/Dockerfile's
# own `docker run` example). Coolify's docker-compose build pack needs both
# services defined in one file to deploy them together, so this combines them
# using nothing but the two source files' own confirmed shipped defaults:
#   - graphrag-server/Dockerfile: EMBEDDING_BACKEND, EMBEDDING_DIM, QDRANT_URL,
#     COLLECTION_NAME defaults, port 8080
#   - graphrag-server/docker-compose.yml: the qdrant service definition
# Build context is repo root (not graphrag-server/) because the Dockerfile
# does `COPY . .` and needs the full Cargo workspace to build the
# `graphrag-server` package with `cargo build --release -p graphrag-server`.
# ============================================================================
version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    # GOLDEN RULE: never publish a port to the host on these VPSs. These were
    # previously `ports: ["6333:6333", "6334:6334"]`, which bound Qdrant's REST
    # and gRPC APIs to the host interface - i.e. onto the raw VPS IP, outside
    # Traefik, outside Cloudflare Access, outside the WAF. An unauthenticated
    # vector DB reachable by IP regardless of any Access policy on the domain.
    # expose: keeps both ports on the internal Docker network only, which is
    # all graphrag-server needs to reach qdrant:6334. Qdrant is an internal
    # dependency and has no FQDN, so it gets no Traefik router at all.
    # No ports: and no expose:. Qdrant is internal-only - it has no FQDN and
    # needs no Traefik router. Sibling containers reach it at qdrant:6334 over
    # the internal Docker network with nothing declared here; expose: would
    # grant no access that doesn't already exist and restrict nothing.
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  # One-shot init job: pulls the embedding model into the ollama service
  # above, then exits. graphrag-server's depends_on condition below waits
  # for this to finish successfully before it starts, so the model is
  # already present the first time EmbeddingService checks for it.
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    entrypoint:
      - /bin/sh
      - -c
      # Bare host:port, no scheme: Ollama's own Dockerfile bakes in
      # OLLAMA_HOST=0.0.0.0:11434 (confirmed from its published source) -
      # the Go CLI's address parser doesn't accept a "http://" prefix here,
      # unlike graphrag-server's own OLLAMA_URL (parsed by a different,
      # unrelated Rust crate that does want the scheme). Verbose + capped
      # retry loop so a failure here is diagnosable from plain container
      # logs instead of a silent, instant exit.
      # $$ (not $): compose interpolates bare $VAR in YAML values using its
      # own env before the container ever sees this string, so shell
      # variables meant for the container's /bin/sh must be escaped.
      - |
        export OLLAMA_HOST=ollama:11434
        echo "ollama-pull: waiting for $$OLLAMA_HOST to accept requests"
        i=0
        until ollama list; do
          i=$$((i+1))
          if [ "$$i" -ge 60 ]; then
            echo "ollama-pull: gave up after 60 attempts (120s), still can't reach $$OLLAMA_HOST"
            exit 1
          fi
          sleep 2
        done
        echo "ollama-pull: server is up, pulling nomic-embed-text"
        ollama pull nomic-embed-text
    restart: "no"

  graphrag-server:
    build:
      context: .
      dockerfile: graphrag-server/Dockerfile
    # expose only, matching the sibling app "paper--oxidizer" (also
    # dockercompose build pack, same Coolify instance) which works: it
    # uses expose: only (no host-level ports: publish) plus a
    # docker_compose_domains entry with the CONTAINER-INTERNAL port baked
    # into the domain URL (https://host:<container-port>). Traefik here
    # connects to containers over the internal docker network directly
    # (traefik.docker.network=<app-uuid> in the generated labels), never
    # via a host-published port, so publishing one was never useful and
    # actively caused Coolify to auto-generate a second, competing router
    # pointing at the wrong (host-side) port. No custom traefik.* labels
    # either - paper-oxidizer has none; Coolify's own auto-generation
    # from docker_compose_domains + expose: is sufficient once the port
    # in docker_compose_domains matches the container's actual port.
    # No ports: and no expose:. expose: is vestigial - Traefik reads the upstream
    # port from loadbalancer.server.port (below), never from expose:.
    # The ONE label Coolify 4.3.3 does not generate itself. Without it the
    # Host() router has no upstream and Traefik returns 503 "no available
    # server" (wiki F-06). Commit 7b7056b deleted this line along with the
    # host-port publish; dropping the publish was right, dropping this was
    # not - they were unrelated. Only this one label: the competing-router
    # problem 7b7056b diagnosed came from ports: ["9090:8080"] making Coolify
    # generate a second router at the host port, and that publish is now gone
    # for good (golden rule), so the conflict cannot recur. Declaring the full
    # router set by hand is what duplicated routers before - do not re-add it.
    labels:
      - "traefik.http.services.graphrag-server.loadbalancer.server.port=8080"
    environment:
      # No manual SERVICE_URL_*/SERVICE_FQDN_* here - paper-oxidizer
      # doesn't declare one either. Coolify auto-injects SERVICE_URL_
      # <SERVICE_NAME>/SERVICE_FQDN_<SERVICE_NAME> itself based on the
      # compose service name; the actual FQDN -> port wiring comes from
      # the app-level docker_compose_domains field (PATCHed separately),
      # not from an env var declared here.
      - EMBEDDING_BACKEND=ollama
      # 768, NOT the Dockerfile's 384 default. 384 is the *hash* backend's
      # dimension (graphrag-server/src/embeddings.rs:42); nomic-embed-text
      # emits 768 (this repo's own config_handler.rs:223-224). embeddings.rs
      # :215-218 hard-validates embedding.len() against EMBEDDING_DIM, so at
      # 384 every Ollama call failed validation and silently fell through to
      # the hash fallback - the server looked healthy and never once used
      # Ollama. A silent wrong answer, not a crash.
      - EMBEDDING_DIM=768
      # Host only, no port: ollama-rs's Ollama::new(host, port) call hard-
      # codes port 11434 as its own second argument, so a URL that already
      # includes ":11434" here would double up into "http://ollama:11434:11434".
      - OLLAMA_URL=http://ollama
      - OLLAMA_EMBEDDING_MODEL=nomic-embed-text
      - QDRANT_URL=http://qdrant:6334
      - COLLECTION_NAME=graphrag
      # Coolify magic var: generates and injects a random 64-char base64
      # secret at deploy time, replacing the Dockerfile's placeholder
      # JWT_SECRET=change-me-in-production default.
      - JWT_SECRET=${SERVICE_BASE64_64_JWTSECRET}
    depends_on:
      qdrant:
        condition: service_started
      ollama:
        condition: service_started
    restart: unless-stopped

volumes:
  qdrant_storage:
    driver: local
  ollama_data:
    driver: local
